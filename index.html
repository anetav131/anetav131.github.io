
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVA Studio | Praha</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:#eeeae4;
    color:#34312d;
    font-family:'DM Sans',sans-serif;
}

header {
    height:90px;
    padding:0 9%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    border-bottom:1px solid #d9d2c8;
}

.logo {
    font-family:'Playfair Display',serif;
    font-size:34px;
    letter-spacing:6px;
}

.logo span { color:#a99a85; }

.header-info {
    font-size:9px;
    letter-spacing:2px;
    color:#81796f;
}

main {
    min-height:calc(100vh - 155px);
    display:grid;
    grid-template-columns:1fr 1fr;
    align-items:center;
    padding:65px 9%;
    gap:55px;
}

.label {
    font-size:10px;
    letter-spacing:3px;
    color:#9a8873;
    margin-bottom:25px;
}

h1 {
    font-family:'Playfair Display',serif;
    font-weight:400;
    font-size:clamp(65px,8vw,105px);
    line-height:1.03;
}

h1 em {
    color:#a4937e;
    font-weight:400;
}

.description {
    margin-top:28px;
    max-width:420px;
    font-size:13px;
    line-height:2;
    color:#777168;
}

.link {
    display:inline-block;
    margin-top:36px;
    padding:16px 27px;
    background:#34312d;
    color:white;
    text-decoration:none;
    font-size:10px;
    letter-spacing:2px;
    transition:.3s;
}

.link:hover {
    background:#9e8d78;
    transform:translateY(-3px);
}

.visual {
    height:460px;
    background:#d8cfc2;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    overflow:hidden;
}

.visual::before {
    content:"";
    width:68%;
    height:80%;
    border:1px solid rgba(255,255,255,.8);
    border-radius:180px 180px 0 0;
    position:absolute;
}

.visual::after {
    content:"AVA";
    font-family:'Playfair Display',serif;
    font-size:clamp(65px,10vw,130px);
    font-style:italic;
    color:rgba(255,255,255,.5);
    letter-spacing:5px;
}

.visual small {
    position:absolute;
    bottom:22px;
    left:22px;
    font-size:9px;
    letter-spacing:2px;
    color:#514a40;
}

footer {
    padding:25px 9%;
    display:flex;
    justify-content:space-between;
    border-top:1px solid #d9d2c8;
    color:#81796f;
    font-size:9px;
    letter-spacing:2px;
}

@media(max-width:750px) {
    main {
        grid-template-columns:1fr;
        padding:60px 7%;
    }
    .visual { height:310px; }
    h1 { font-size:72px; }
    header { padding:0 7%; }
    footer { gap:12px; flex-wrap:wrap; }
}
</style>
</head>

<body>

<header>
    <div class="logo">AVA<span>.</span></div>
    <div class="header-info">MOVEMENT STUDIO · PRAHA 1</div>
</header>

<main>
    <div>
        <div class="label">POLE DANCE & MOVEMENT STUDIO</div>

        <h1>
            Movement<br>
            <em>in balance.</em>
        </h1>

        <p class="description">
            Studio pro pole dance, aerial hoop a funkční pohyb.
            Tři sály, individuální přístup a lekce pro různé úrovně.
        </p>

        <a class="link" href="/prvnihodina.html">
            VSTOUPIT DO STUDIA &nbsp; ↗
        </a>
    </div>

    <div class="visual">
        <small>AVA STUDIO / PRAGUE</small>
    </div>
</main>

<footer>
    <span>AVA STUDIO</span>
    <span>POLE · AERIAL · MOVEMENT</span>
</footer>

</body>
</html>
