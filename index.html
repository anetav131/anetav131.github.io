
<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AVA. | Movement Studio</title>

<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">

<style>
* { margin:0; padding:0; box-sizing:border-box; }

body {
    background:#eae5dd;
    color:#302e2a;
    font-family:'DM Sans',sans-serif;
    min-height:100vh;
}

header {
    height:95px;
    padding:0 9%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    border-bottom:1px solid #d6cec3;
}

.logo {
    font-family:'Playfair Display',serif;
    font-size:38px;
    letter-spacing:7px;
}

.logo span { color:#aa9983; }

.header-label {
    font-size:9px;
    letter-spacing:3px;
    color:#83796d;
}

.hero {
    min-height:650px;
    padding:65px 9%;
    display:grid;
    grid-template-columns:1.1fr .9fr;
    align-items:center;
    gap:35px;
}

.eyebrow {
    font-size:10px;
    letter-spacing:4px;
    color:#998873;
    margin-bottom:30px;
}

h1 {
    font-family:'Playfair Display',serif;
    font-weight:400;
    font-size:clamp(65px,8vw,110px);
    line-height:.98;
    letter-spacing:-3px;
}

h1 em {
    color:#a3927c;
    font-weight:400;
}

.subtitle {
    margin-top:35px;
    font-size:11px;
    letter-spacing:4px;
    color:#81776b;
}

.enter {
    display:inline-block;
    margin-top:42px;
    padding:19px 34px;
    background:#302e2a;
    color:white;
    text-decoration:none;
    font-size:10px;
    letter-spacing:2px;
    transition:.35s;
}

.enter:hover {
    background:#a3927c;
    transform:translateY(-5px);
}

.art {
    height:440px;
    background:#d6ccbd;
    position:relative;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;
    animation:appear 1.2s ease;
}

.art::before {
    content:"";
    position:absolute;
    width:270px;
    height:360px;
    border:1px solid rgba(255,255,255,.8);
    border-radius:160px 160px 0 0;
}

.art::after {
    content:"A";
    font-family:'Playfair Display',serif;
    font-size:340px;
    font-style:italic;
    color:rgba(255,255,255,.3);
}

.art-caption {
    position:absolute;
    bottom:25px;
    left:25px;
    font-size:9px;
    letter-spacing:3px;
    color:#514a40;
}

.side-number {
    position:absolute;
    right:9%;
    top:45%;
    writing-mode:vertical-rl;
    font-size:9px;
    letter-spacing:4px;
    color:#a39480;
}

footer {
    padding:25px 9%;
    border-top:1px solid #d6cec3;
    display:flex;
    justify-content:space-between;
    color:#82796d;
    font-size:9px;
    letter-spacing:2px;
}

@keyframes appear {
    from { opacity:0; transform:translateY(20px); }
    to { opacity:1; transform:translateY(0); }
}

@media(max-width:750px) {
    .hero { grid-template-columns:1fr; padding:65px 7%; }
    .art { height:330px; }
    h1 { font-size:70px; }
    header { padding:0 7%; }
    .header-label { font-size:7px; letter-spacing:1px; }
    .side-number { display:none; }
    footer { gap:12px; flex-wrap:wrap; }
}
</style>
</head>

<body>

<header>
    <div class="logo">AVA<span>.</span></div>
    <div class="header-label">POLE DANCE & MOVEMENT STUDIO</div>
</header>

<main>
<section class="hero">

    <div>
        <div class="eyebrow">EST. IN PRAGUE · PRAHA 1</div>

        <h1>
            MOVE<br>
            WITH<br>
            <em>CONFIDENCE.</em>
        </h1>

        <div class="subtitle">
            STRENGTH · ELEGANCE · MOVEMENT
        </div>

        <a href="/prvnihodina.html" class="enter">
            ENTER THE WORLD OF AVA &nbsp; ↗
        </a>
    </div>

    <div class="art">
        <div class="art-caption">AVA STUDIO · PRAGUE</div>
    </div>

</section>

<div class="side-number">POLE DANCE · AERIAL · FITNESS</div>
</main>

<footer>
    <span>AVA. MOVEMENT STUDIO</span>
    <span>PRAGUE · CZECH REPUBLIC</span>
</footer>

</body>
</html>
